name: pagolab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pagolab
      POSTGRES_PASSWORD: pagolab
      POSTGRES_DB: pagolab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagolab -d pagolab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
name: pagolab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pagolab
      POSTGRES_PASSWORD: pagolab
      POSTGRES_DB: pagolab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagolab -d pagolab"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    environment:
      DATABASE_URL: postgres://pagolab:pagolab@postgres:5432/pagolab?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db
    command: ["--wait", "up"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

name: pagolab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pagolab
      POSTGRES_PASSWORD: pagolab
      POSTGRES_DB: pagolab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagolab -d pagolab"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    environment:
      DATABASE_URL: postgres://pagolab:pagolab@postgres:5432/pagolab?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db
    command: ["--wait", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  gateway-sim:
    build: ./apps/gateway-sim
    environment:
      SLOW_RATE: "0.15"
      SLOW_MS: "5000"
    ports:
      - "4000:4000"
    init: true

  merchant-sim:
    build: ./apps/merchant-sim
    environment:
      WEBHOOK_SECRET: whsec_local
      FAIL_RATE: "${FAIL_RATE:-0.2}"
    ports:
      - "4100:4100"
    init: true

  payments-api:
    build: ./apps/payments-api
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://pagolab:pagolab@postgres:5432/pagolab
      GATEWAY_URL: http://gateway-sim:4000
      GATEWAY_TIMEOUT_MS: "2000"
      RESOLVER_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092  
      RELAY_ENABLED: "true"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-30}"
      RATE_LIMIT_PER_SECOND: "${RATE_LIMIT_PER_SECOND:-10}"
    ports:
      - "3000:3000"
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway-sim:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
  
  kafka-init:
    image: apache/kafka:3.9.0
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka:/scripts
    depends_on: 
      kafka:
        condition: service_healthy

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: pagolab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
  
  notifier:
    build: ./apps/notifier
    environment:
      DATABASE_URL: postgres://pagolab:pagolab@postgres:5432/pagolab
      KAFKA_BROKERS: kafka:9092
      MERCHANT_WEBHOOK_URL: http://merchant-sim:4100/webhooks/pagolab
      WEBHOOK_SECRET: whsec_local
    init: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      merchant-sim:
        condition: service_started

  ledger:
    build: ./apps/ledger
    environment:
      DATABASE_URL: postgres://pagolab:pagolab@postgres:5432/pagolab
      KAFKA_BROKERS: kafka:9092
    init: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
        
volumes:
  pgdata:
  kafkadata:

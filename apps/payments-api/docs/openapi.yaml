openapi: 3.1.0
info:
  title: PagoLab Payments API
  version: 0.1.0
  description: Núcleo de pagos con idempotencia, máquina de estados y resolución de estados desconocidos.
servers:
  - url: http://localhost:3000
paths:
  /payments:
    post:
      summary: Crear y cobrar un pago
      operationId: createPayment
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePayment' }
      responses:
        '201':
          description: Pago procesado con estado final (APPROVED, DECLINED o FAILED).
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '202':
          description: Estado desconocido (timeout de la pasarela). Se resolverá de forma asíncrona.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      summary: Listar pagos del comercio (paginación por cursor)
      operationId: listPayments
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página de pagos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentPage' }
        '400': { $ref: '#/components/responses/Problem' }
  /payments/{id}:
    get:
      summary: Consultar un pago
      operationId: getPayment
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Pago
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    MerchantId:
      name: X-Merchant-Id
      in: header
      required: true
      description: Identificador del comercio. En la Fase 3 se reemplaza por un token OAuth2.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
  schemas:
    PaymentStatus:
      type: string
      enum: [PENDING, PROCESSING, APPROVED, DECLINED, UNKNOWN, FAILED]
    CreatePayment:
      type: object
      required: [amountCents, currency]
      additionalProperties: false
      properties:
        amountCents: { type: integer, minimum: 1, maximum: 1000000000, description: Monto en centavos }
        currency: { type: string, enum: [COP, USD] }
        description: { type: string, maxLength: 140 }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchantId: { type: string }
        amountCents: { type: integer }
        currency: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        gatewayRef: { type: [string, 'null'] }
        attempts: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        nextCursor: { type: [string, 'null'] }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
  headers:
    RateLimit-Limit:
      description: Capacidad del token bucket del comercio (ráfaga máxima de creaciones).
      schema: { type: integer, minimum: 1 }
    RateLimit-Remaining:
      description: Creaciones disponibles de inmediato para el comercio.
      schema: { type: integer, minimum: 0 }
    Retry-After:
      description: Segundos que el comercio debe esperar antes de reintentar.
      schema: { type: integer, minimum: 1 }
  responses:
    Problem:
      description: Error en formato RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: El comercio superó su límite de creación de pagos. No se reclamó la Idempotency-Key ni se llamó a la pasarela, así que reintentar con la misma clave es seguro.
      headers:
        Retry-After: { $ref: '#/components/headers/Retry-After' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }